name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio ruff
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Run test suite
        run: |
          pytest -v
      - name: Test CLI smoke
        run: |
          linkedin-agent doctor
