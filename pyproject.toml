[project]
name = "linkedin-agent-suite"
version = "1.0.0"
description = "Unified Standalone LinkedIn Agent Suite: Browser Execution, Profile & Job Intelligence, and Automatic Content Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "patchright>=1.48.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "anyio>=4.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0"
]
mcp = [
    "fastmcp>=0.4.0"
]

[project.scripts]
linkedin-agent = "linkedin_agent_suite.cli.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["linkedin_agent_suite*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
